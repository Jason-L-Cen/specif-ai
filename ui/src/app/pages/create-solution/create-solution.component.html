<ngx-loading
  [show]="loading"
  [config]="{ backdropBorderRadius: '3px' }"
></ngx-loading>
<header
  class="flex items-center justify-between py-3 bg-secondary-50 sticky top-0"
>
  <h1 class="text-lg font-semibold">创建解决方案</h1>
  <div class="flex gap-2">
    <app-button
      buttonContent="取消"
      [disabled]="loading"
      size="sm"
      theme="secondary_outline"
      (click)="navigateToDashboard()"
    ></app-button>
    <app-button
      buttonContent="创建解决方案"
      [disabled]="isCreateSolutionDisabled"
      size="sm"
      (click)="createSolution()"
    ></app-button>
  </div>
</header>
<form [formGroup]="solutionForm" class="flex flex-col gap-3 overflow-auto pb-4">
  <!-- 基本信息 Section -->
  <app-custom-accordion [id]="'basic-info'" [isOpen]="true">
    <ng-container accordion-trigger>
      <div class="flex flex-col text-sm gap-0.5">
        <span class="font-semibold text-foreground">基本信息</span>
        <span class="font-normal text-muted-foreground"
          >填写计划开发的应用的基本信息。</span
        >
      </div>
    </ng-container>
    <ng-container accordion-body>
      <div class="sm:grid sm:grid-cols-3 sm:items-start sm:gap-4 sm:py-3">
        <label
          class="block text-sm font-medium leading-6 text-secondary-900 sm:pt-1.5"
          >解决方案名称<span class="text-danger-500 text-xs"> *</span></label
        >

        <app-input-field
          formControlName="name"
          elementId="solution-name"
          elementName="解决方案名称"
          elementPlaceHolder="解决方案名称"
          [showLabel]="false"
          [required]="true"
          class="sm:col-span-2"
        />
        <app-error-message [errorControl]="solutionForm.get('name')" />
      </div>

      <div class="sm:grid sm:grid-cols-3 sm:items-start sm:gap-4 sm:py-3">
        <div>
          <label
            class="block text-sm font-medium leading-6 text-secondary-900 sm:pt-1.5"
            >解决方案描述<span class="text-danger-500 text-xs">
              *</span
            ></label
          >
          <p class="text-xs leading-6 text-muted-foreground">
            用几句话描述你的想法
          </p>
        </div>
        <div class="mt-2 sm:col-span-2 sm:mt-0">
          <app-textarea-field
            formControlName="description"
            elementId="solution-description"
            elementName="解决方案描述"
            elementPlaceHolder="解决方案描述"
            [showLabel]="false"
            [rows]="4"
            [required]="true"
          />
          <app-error-message [errorControl]="solutionForm.get('description')" />
        </div>
      </div>

      <div class="sm:grid sm:grid-cols-3 sm:items-start sm:gap-4 sm:py-3">
        <div>
          <label
            class="block text-sm font-medium leading-6 text-secondary-900 sm:pt-1.5"
            >技术细节<span *ngIf="technicalDetailsMode !== 'none'" class="text-danger-500 text-xs">
              *</span
            ></label
          >
          <p class="text-xs leading-6 text-muted-foreground">
            选择技术栈、自行填写，或暂不设定
          </p>
        </div>
        <div class="mt-2 sm:col-span-2 sm:mt-0">
          <fieldset class="space-y-3">
            <legend class="sr-only">技术细节填写方式</legend>
            <div class="grid grid-cols-[6.5rem_minmax(0,1fr)] items-center gap-3">
              <label class="flex cursor-pointer items-center gap-2 text-sm text-secondary-900">
                <input type="radio" name="technical-details-mode" value="guided"
                  [checked]="technicalDetailsMode === 'guided'" (change)="setTechnicalDetailsMode('guided')"
                  aria-controls="technical-stack-selector" class="h-4 w-4 accent-primary-600" />
                选择技术栈
              </label>
              <div>
                <button type="button" id="technical-stack-selector" [matMenuTriggerFor]="architectureMenu"
                  [disabled]="technicalDetailsMode !== 'guided'" [title]="technicalStackLabel"
                  class="flex min-h-[44px] w-full items-center justify-between gap-2 rounded-lg border border-secondary-200 bg-white px-3 py-2.5 text-left text-sm text-secondary-900 disabled:bg-secondary-100 disabled:text-secondary-400 focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-primary-500">
                  <span class="truncate" [class.text-secondary-400]="!technicalStackLabel">{{ technicalStackLabel || '请选择：架构 → 语言 → 框架 → 前端 → 数据库' }}</span>
                  <span aria-hidden="true" class="text-secondary-400">▾</span>
                </button>
                <app-error-message *ngIf="technicalDetailsMode === 'guided'" [errorControl]="solutionForm.get('technicalDetails')" />
              </div>
            </div>
            <div class="grid grid-cols-[6.5rem_minmax(0,1fr)] items-start gap-3">
              <label class="flex cursor-pointer items-center gap-2 pt-4 text-sm text-secondary-900">
                <input type="radio" name="technical-details-mode" value="custom"
                  [checked]="technicalDetailsMode === 'custom'" (change)="setTechnicalDetailsMode('custom')"
                  aria-controls="technical-details" class="h-4 w-4 accent-primary-600" />
                自定义输入
              </label>
              <div>
                <app-textarea-field [formControl]="customTechnicalDetails" elementId="technical-details"
                  elementName="技术细节" elementPlaceHolder="自行描述应用的技术栈"
                  [showLabel]="false" [rows]="3" [required]="technicalDetailsMode === 'custom'" />
                <app-error-message *ngIf="technicalDetailsMode === 'custom'" [errorControl]="customTechnicalDetails" />
              </div>
            </div>
            <label class="flex w-fit cursor-pointer items-center gap-2 text-sm text-secondary-900">
              <input type="radio" name="technical-details-mode" value="none"
                [checked]="technicalDetailsMode === 'none'" (change)="setTechnicalDetailsMode('none')"
                class="h-4 w-4 accent-primary-600" />
              None（暂时没有技术栈）
            </label>
          </fieldset>

          <mat-menu #architectureMenu="matMenu" aria-label="应用架构">
            <button type="button" mat-menu-item class="!pl-3 !pr-7" *ngFor="let option of getTechnicalOptions('architecture'); trackBy: trackTechnicalOption"
              [matMenuTriggerFor]="languageMenu" [matMenuTriggerData]="{ stack: nextTechnicalStack('architecture', option.value) }">
              <span class="text-sm">{{ option.label }}</span>
            </button>
          </mat-menu>
          <mat-menu #languageMenu="matMenu" aria-label="开发语言">
            <ng-template matMenuContent let-stack="stack">
              <button type="button" mat-menu-item class="!pl-3 !pr-7" *ngFor="let option of getTechnicalOptions('language', stack); trackBy: trackTechnicalOption"
                [matMenuTriggerFor]="frameworkMenu" [matMenuTriggerData]="{ stack: nextTechnicalStack('language', option.value, stack) }">
                <span class="text-sm">{{ option.label }}</span>
              </button>
            </ng-template>
          </mat-menu>
          <mat-menu #frameworkMenu="matMenu" aria-label="应用框架">
            <ng-template matMenuContent let-stack="stack">
              <button type="button" mat-menu-item class="!pl-3 !pr-7" *ngFor="let option of getTechnicalOptions('framework', stack); trackBy: trackTechnicalOption"
                [matMenuTriggerFor]="frontendMenu" [matMenuTriggerData]="{ stack: nextTechnicalStack('framework', option.value, stack) }">
                <span class="text-sm">{{ option.label }}</span>
              </button>
            </ng-template>
          </mat-menu>
          <mat-menu #frontendMenu="matMenu" aria-label="前端或界面">
            <ng-template matMenuContent let-stack="stack">
              <button type="button" mat-menu-item class="!pl-3 !pr-7" *ngFor="let option of getTechnicalOptions('frontend', stack); trackBy: trackTechnicalOption" [title]="option.label"
                [matMenuTriggerFor]="databaseMenu" [matMenuTriggerData]="{ stack: nextTechnicalStack('frontend', option.value, stack) }">
                <span class="text-sm">{{ option.value === 'html' ? 'HTML / CSS / JS' : option.label.split('（')[0] }}</span>
              </button>
            </ng-template>
          </mat-menu>
          <mat-menu #databaseMenu="matMenu" aria-label="数据库">
            <ng-template matMenuContent let-stack="stack">
              <button type="button" mat-menu-item class="!px-3" *ngFor="let option of getTechnicalOptions('database', stack); trackBy: trackTechnicalOption"
                (click)="selectTechnicalStack(nextTechnicalStack('database', option.value, stack))">
                <span class="text-sm">{{ option.label }}</span>
              </button>
            </ng-template>
          </mat-menu>
        </div>
      </div>

      <div class="sm:grid sm:grid-cols-3 sm:items-center sm:gap-4 sm:py-3">
        <div>
          <label class="block text-sm font-medium leading-6 text-secondary-900"
            >该解决方案是否已实现？<span class="text-danger-500 text-xs">
              *</span
            ></label
          >
          <p class="text-xs leading-6 text-muted-foreground">
            {{ getSolutionToggleDescription() }}
          </p>
        </div>
        <div class="col-span-2 flex items-center">
          <div class="mt-1.5">
            <app-toggle
              [isActive]="solutionForm.get('cleanSolution')?.value"
              (toggleChange)="
                solutionForm.get('cleanSolution')?.setValue($event)
              "
              isPlainToggle="true"
            ></app-toggle>
          </div>
        </div>
      </div>
    </ng-container>
  </app-custom-accordion>

  <!-- Preferences Section -->
  <app-custom-accordion
    [id]="'preferences'"
    *ngIf="showGenerationPreferencesTab()"
    [isOpen]="false"
  >
    <ng-container accordion-trigger>
      <div class="flex flex-col text-sm gap-0.5">
        <span class="font-semibold text-foreground">偏好设置</span>
        <span class="font-normal text-muted-foreground"
          >根据需求配置项目设置。</span
        >
      </div>
    </ng-container>
    <ng-container accordion-body>
      <div
        class="sm:grid sm:grid-cols-3 sm:items-center sm:gap-4 sm:py-4"
        *ngIf="!solutionForm.get('cleanSolution')?.value"
      >
        <div>
          <label class="block text-sm font-medium leading-6 text-secondary-900">
            业务需求（BRD）<span class="text-danger-500 text-xs">
              *</span
            >
          </label>
          <p class="text-xs leading-6 text-muted-foreground">
            设置业务需求的最少数量
          </p>
        </div>
        <div class="flex items-center col-span-2 gap-4">
          <app-toggle
            [isActive]="solutionForm.get('BRD')?.get('enabled')?.value"
            (toggleChange)="onRequirementToggle('BRD', $event)"
            isPlainToggle="true"
          ></app-toggle>
          <div
            formGroupName="BRD"
            *ngIf="solutionForm.get('BRD')?.get('enabled')?.value"
          >
            <app-slider formControlName="minCount"></app-slider>
          </div>
        </div>
      </div>

      <div
        class="sm:grid sm:grid-cols-3 sm:items-center sm:gap-4 sm:py-4"
        *ngIf="!solutionForm.get('cleanSolution')?.value"
      >
        <div>
          <label class="block text-sm font-medium leading-6 text-secondary-900">
            产品需求（PRD）<span class="text-danger-500 text-xs">
              *</span
            >
          </label>
          <p class="text-xs leading-6 text-muted-foreground">
            设置产品需求的最少数量
          </p>
        </div>
        <div class="flex items-center col-span-2 gap-4">
          <app-toggle
            [isActive]="solutionForm.get('PRD')?.get('enabled')?.value"
            (toggleChange)="onRequirementToggle('PRD', $event)"
            isPlainToggle="true"
          ></app-toggle>
          <div
            *ngIf="solutionForm.get('PRD')?.get('enabled')?.value"
            formGroupName="PRD"
          >
            <app-slider formControlName="minCount"></app-slider>
          </div>
        </div>
      </div>

      <div
        class="sm:grid sm:grid-cols-3 sm:items-center sm:gap-4 sm:py-4"
        *ngIf="!solutionForm.get('cleanSolution')?.value"
      >
        <div>
          <label class="block text-sm font-medium leading-6 text-secondary-900">
            界面需求（UIR）<span class="text-danger-500 text-xs"> *</span>
          </label>
          <p class="text-xs leading-6 text-muted-foreground">
            设置界面需求的最少数量
          </p>
        </div>
        <div class="flex items-center col-span-2 gap-4">
          <app-toggle
            [isActive]="solutionForm.get('UIR')?.get('enabled')?.value"
            (toggleChange)="onRequirementToggle('UIR', $event)"
            isPlainToggle="true"
          ></app-toggle>
          <div
            *ngIf="solutionForm.get('UIR')?.get('enabled')?.value"
            formGroupName="UIR"
          >
            <app-slider formControlName="minCount"></app-slider>
          </div>
        </div>
      </div>

      <div
        class="sm:grid sm:grid-cols-3 sm:items-center sm:gap-4 sm:py-4"
        *ngIf="!solutionForm.get('cleanSolution')?.value"
      >
        <div>
          <label class="block text-sm font-medium leading-6 text-secondary-900">
            非功能需求（NFR）<span
              class="text-danger-500 text-xs"
            >
              *</span
            >
          </label>
          <p class="text-xs leading-6 text-muted-foreground">
            设置非功能需求的最少数量
          </p>
        </div>
        <div class="flex items-center col-span-2 gap-4">
          <app-toggle
            [isActive]="solutionForm.get('NFR')?.get('enabled')?.value"
            (toggleChange)="onRequirementToggle('NFR', $event)"
            isPlainToggle="true"
          ></app-toggle>
          <div
            *ngIf="solutionForm.get('NFR')?.get('enabled')?.value"
            formGroupName="NFR"
          >
            <app-slider formControlName="minCount"></app-slider>
          </div>
        </div>
      </div>
    </ng-container>
  </app-custom-accordion>

  <!-- MCP 集成 Section -->
  <app-custom-accordion [id]="'integrations'">
    <ng-container accordion-trigger>
      <div class="flex flex-col text-sm gap-0.5">
        <span class="font-semibold text-foreground">MCP 集成</span>
        <span class="font-normal text-muted-foreground"
          >将模型上下文协议（MCP）服务器接入项目。</span
        >
      </div>
    </ng-container>
    <ng-container accordion-body>
      <div class="flex flex-col gap-4 w-full">
        <app-mcp-integration-configurator
          formControlName="mcpSettings"
        ></app-mcp-integration-configurator>
      </div>
    </ng-container>
  </app-custom-accordion>
</form>
