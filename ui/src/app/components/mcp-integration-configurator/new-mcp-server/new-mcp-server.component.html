<div class="p-4 flex flex-col gap-2">
  <h2>{{ "添加 MCP 服务器" | i18n }}</h2>
  <form [formGroup]="form" class="flex flex-col gap-2">
    <div class="flex flex-col gap-1.5">
      <app-input-field
        formControlName="serverId"
        elementId="serverId"
        [elementName]="&quot;服务器标识&quot; | i18n"
        [elementPlaceHolder]="&quot;请输入服务器标识&quot; | i18n"
        [required]="true"
      ></app-input-field>
      <span *ngIf="isServerIdInvalid" class="text-xs text-danger-600">
        {{ "请输入有效的服务器标识，仅允许英文字母、数字、连字符、句点和下划线。" | i18n }}
      </span>
    </div>

    <div class="flex flex-col gap-1.5">
      <app-textarea-field
        formControlName="serverConfig"
        elementId="serverConfig"
        [elementName]="&quot;服务器配置&quot; | i18n"
        [elementPlaceHolder]="&quot;请输入 MCP 服务器配置 JSON&quot; | i18n"
        [required]="true"
        [rows]="10"
        (paste)="onServerConfigPaste($event)"
      ></app-textarea-field>
      <span *ngIf="isServerConfigJsonInvalid" class="text-xs text-danger-600">
        {{ "请输入有效的服务器配置 JSON。" | i18n }}
      </span>
      <span *ngIf="isServerConfigSchemaInvalid && !isServerConfigJsonInvalid" class="text-xs text-danger-600">
        {{ "服务器配置不符合要求的数据结构。" | i18n }}
      </span>
      <div class="flex gap-1 text-xs">
        {{ "下载示例" | i18n }}
        <a [href]="getStdioServerDownloadUrl()" download="sample-stdio-server-config.json" class="text-blue-600 hover:underline">stdio</a> {{ "或" | i18n }}
        <a [href]="getSseServerDownloadUrl()" download="sample-sse-server-config.json" class="text-blue-600 hover:underline">sse</a> {{ "服务器配置以供参考" | i18n }}
      </div>
    </div>

    
    <div class="flex gap-1 justify-end">
      <app-button [buttonContent]="&quot;取消&quot; | i18n" size="sm" (click)="onCancel()" theme="secondary_outline"></app-button>
      <app-button [buttonContent]="&quot;验证&quot; | i18n" size="sm" [disabled]="form.invalid || isValidating" (click)="onValidate()" theme="primary"></app-button>
      <app-button [buttonContent]="&quot;提交&quot; | i18n" size="sm" [disabled]="form.invalid || !isValidated || validatedServerStatus?.status === 'error'" (click)="onSubmit()" theme="primary"></app-button>
    </div>
  </form>

  <div *ngIf="showServerInformation && validatedServerStatus" class="flex flex-col gap-2">
    <h3>{{ "服务器验证结果" | i18n }}</h3>
    <app-mcp-servers-item [server]="validatedServerStatus"></app-mcp-servers-item>
  </div>
</div>
