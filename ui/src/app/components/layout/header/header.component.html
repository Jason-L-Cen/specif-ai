<ng-container *ngIf="(startupService.isLoggedIn$ | async) === true">
  <header
    class="bg-white border-b [app-region:drag] select-none h-[39px] w-full"
  >
    <div class="flex items-center justify-between pl-4">
      <div class="min-w-0 flex-1 overflow-hidden whitespace-nowrap" [ngClass]="{ 'pl-16': isMacOS && !isFullscreen }">
        <app-breadcrumbs />
      </div>
      <div class="flex shrink-0 items-center gap-x-3 pl-3">
        <div class="flex items-center gap-2">
          <ng-container
            *ngIf="themeConfiguration.appLogoDark.length > 0; else showAppName"
          >
            <img
              [src]="themeConfiguration.appLogoDark"
              class="h-7 w-7 shrink-0"
              [alt]="&quot;Ace PDA 标志&quot; | i18n"
            />
            <div class="leading-tight">
              <p class="text-xs font-semibold text-secondary-900">{{ themeConfiguration.appName }}</p>
              <p class="text-[9px] text-secondary-500">{{ isEnglish ? 'Ace PDA' : themeConfiguration.appEnglishName }}</p>
            </div>
          </ng-container>
          <ng-template #showAppName>
            <h1 class="text-sm text-secondary-900">
              {{ themeConfiguration.appName }}
            </h1>
          </ng-template>
        </div>
        <button
          (click)="navigateToSettings()"
          (keydown.enter)="navigateToSettings()"
          (keydown.space)="navigateToSettings(); $event.preventDefault()"
          class="flex items-center justify-center h-[39px] px-3.5 border-l border-secondary-200 [app-region:no-drag]"
        >
          <ng-icon name="heroCog8Tooth" strokeWidth="2" size="16" />
          <span class="sr-only">{{ "设置" | i18n }}</span>
        </button>
      </div>
    </div>
  </header>
</ng-container>
