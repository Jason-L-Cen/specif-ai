<div class="p-6 flex flex-col justify-start">
  <div>
    <h1 class="text-2xl font-semibold mb-6">{{ data.title }}</h1>
  </div>
  <div class="rounded-md" [formGroup]="testCaseForm">
    <!-- User Screens Involved Field -->
    <div class="mb-4">
      <label class="block text-secondary-700 text-sm font-medium mb-2">
        涉及的用户界面 <span class="text-secondary-400">（可选）</span>
      </label>
      <p class="text-secondary-500 text-xs mb-2">
        列出用户将操作的界面和界面组件。
      </p>
      <app-textarea-field
        [elementPlaceHolder]="'例如：登录界面、仪表盘、支付表单'"
        elementId="userScreensInvolved"
        formControlName="userScreensInvolved"
        [rows]="5"
      />
    </div>
    
    <!-- Extra Context Field -->
    <div>
      <label class="block text-secondary-700 text-sm font-medium mb-2">
        补充上下文 <span class="text-secondary-400">（可选）</span>
      </label>
      <p class="text-secondary-500 text-xs mb-2">
        补充有助于生成测试用例的信息。
      </p>
      <app-textarea-field
        [elementPlaceHolder]="'例如：边界情况、无障碍要求、用户角色'"
        elementId="extraContext"
        formControlName="extraContext"
        [rows]="5"
      />
    </div>
  </div>
  <div class="flex justify-between mt-6">
    <app-button
      buttonContent="取消"
      theme="secondary"
      size="sm"
      rounded="lg"
      (click)="onClose()"
    />
    <app-button
      buttonContent="生成"
      theme="primary"
      size="sm"
      rounded="lg"
      (click)="onGenerate()"
      [disabled]="testCaseForm.get('selectedUserStoryId')?.invalid === true"
    />
  </div>
</div>
